<!DOCTYPE html>
<!--
  Territory Map.
  Source: maas360-territory-map (index.html + us-map-script.js + us-map-data.js + us-map-styles.css).
  Interactive D3 map kept fully functional; restyled from the light IBM Carbon theme
  into the MaaS360 Sales Guide dark design system.
  NOTE: D3.js, topojson and the us-atlas TopoJSON are loaded from public CDNs at runtime
  (the map needs an internet connection to render the state shapes).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Territory Map — MaaS360 Sales Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="us-map-styles.css">
</head>
<body>
  <nav class="site-nav">
    <div class="site-nav-inner">
      <a class="site-nav-brand" href="index.html"><span class="sq"></span>MaaS360 Sales Guide</a>
      <div class="site-nav-links">
        <a href="index.html">Hub</a>
        <a href="prospecting.html">Prospecting</a>
        <a href="cold-call.html">Cold Call</a>
        <a href="resources.html">Resources</a>
        <a href="onboarding.html">Onboarding</a>
        <a href="rep-alignment.html">Rep Alignment</a>
        <a href="territory-map.html" class="active">Territory Map</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <header>
      <h1>Territory Map</h1>
      <p class="subtitle">Click any state to view the assigned representatives</p>
    </header>

    <div class="content-wrapper">
      <div class="map-section">
        <svg id="us-map" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
          <!-- US States rendered here by JavaScript with D3.js -->
        </svg>
      </div>

      <div class="info-panel">
        <div class="info-header">
          <h2>State Information</h2>
        </div>
        <div id="state-info" class="state-details">
          <div class="placeholder">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
            <p>Click on a state to view representative details</p>
          </div>
        </div>
      </div>
    </div>

    <div class="legend">
      <h3>Legend</h3>
      <div class="legend-items">
        <div class="legend-item">
          <span class="legend-color" style="background: #FF87C2;"></span>
          <span>State with Representative</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #262C32;"></span>
          <span>No Data Available</span>
        </div>
        <div class="legend-item">
          <span class="legend-color" style="background: #FF4FA3;"></span>
          <span>Selected State</span>
        </div>
      </div>
    </div>
  </div>

  <!-- D3.js for map rendering (loaded from public CDNs at runtime) -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson@3"></script>
  <script src="us-map-data.js"></script>
  <script src="us-map-script.js"></script>
</body>
</html>
